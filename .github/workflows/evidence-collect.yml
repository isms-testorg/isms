# Monthly snapshot of the GitHub organisation's security configuration, stored
# as dated evidence. Opens a pull request rather than pushing: main stays
# protected, and a human still reviews what lands in the evidence record.
#
# TOKEN: the default GITHUB_TOKEN cannot read organisation members, their 2FA
# state, or outside collaborators. Create a fine-grained PAT or a GitHub App
# with organisation read permissions and store it as the ISMS_ORG_TOKEN secret.
# Without it the run still succeeds, but the collected files will record what
# could not be read in their "unavailable" list.

name: evidence-collect

on:
  schedule:
    # 03:00 UTC on the first of each month.
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to collect for (YYYY-MM), defaults to the current month"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --disable-pip-version-check pyyaml

      - name: Collect GitHub configuration evidence
        env:
          GH_TOKEN: ${{ secrets.ISMS_ORG_TOKEN || github.token }}
          ISMS_ORG: ${{ github.repository_owner }}
        run: |
          python3 tools/collect_github_evidence.py \
            ${{ inputs.month && format('--month {0}', inputs.month) || '' }}

      - name: Validate with the new evidence in place
        run: python3 tools/check_isms.py

      - name: Commit and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MONTH="${{ inputs.month }}"
          MONTH="${MONTH:-$(date -u +%Y-%m)}"
          BRANCH="isms/evidence-${MONTH}"

          FILES=$(git status --porcelain evidence/ | awk '{print $2}')
          if [ -z "$FILES" ]; then
            echo "No change in the collected evidence, nothing to commit."
            exit 0
          fi
          echo "Changed files:"; echo "$FILES"

          # Committed through the API so GitHub signs it. A plain git push
          # would produce an unsigned commit and break the signature chain
          # that the release pack has to be able to prove.
          python3 tools/commit_via_api.py \
            --branch "$BRANCH" \
            --message "chore(evidence): GitHub configuration snapshot ${MONTH}" \
            $FILES

          if ! gh pr view "$BRANCH" >/dev/null 2>&1; then
            gh pr create \
              --head "$BRANCH" \
              --base main \
              --title "Evidence: GitHub configuration snapshot ${MONTH}" \
              --body "Automated monthly collection for A.5.15, A.5.18, A.8.2, A.8.4, A.8.8 and related controls.

          Review before merging:

          - Does the member list match who should have access today?
          - Is anyone still without two factor authentication?
          - Any repository that lost branch protection?
          - Did any \`unavailable\` entry appear? That means the token lost scope and the evidence has a gap.

          Generated by \`.github/workflows/evidence-collect.yml\`."
          fi
