# Statement of Applicability (clause 6.1.3 d).
#
# One entry per Annex A control. Relationships to documents, risks and evidence
# are derived from their respective source files and are intentionally not
# duplicated here.
#
# status: not_assessed | planned | partially_implemented | implemented | not_applicable

controls:
  - id: A.5.1
    applicable: true
    status: planned
    implementation_note_en: "The information-security policy framework will be approved, communicated and reviewed for dev-test."
    implementation_note_de: "Das Rahmenwerk der Informationssicherheitsleitlinien wird für dev-test genehmigt, kommuniziert und überprüft."
    justification_en:
    justification_de:
  - id: A.5.2
    applicable: true
    status: planned
    implementation_note_en: "Security roles and responsibilities will be assigned to the managing director, CTO, engineering lead, IT lead and ISMS owner."
    implementation_note_de: "Sicherheitsrollen und Verantwortlichkeiten werden dem Managing Director, CTO, Engineering Lead, IT Lead und ISMS Owner zugewiesen."
    justification_en:
    justification_de:
  - id: A.5.3
    applicable: true
    status: planned
    implementation_note_en: "Approval, administration and review duties will be separated across the existing GitHub teams and management roles."
    implementation_note_de: "Genehmigungs-, Administrations- und Prüfaufgaben werden auf die bestehenden GitHub-Teams und Managementrollen verteilt."
    justification_en:
    justification_de:
  - id: A.5.4
    applicable: true
    status: planned
    implementation_note_en: "Management will direct security objectives, provide resources and review security performance."
    implementation_note_de: "Das Management wird Sicherheitsziele steuern, Ressourcen bereitstellen und die Sicherheitsleistung überprüfen."
    justification_en:
    justification_de:
  - id: A.5.5
    applicable: true
    status: planned
    implementation_note_en: "The ISMS owner will maintain contact routes for data-protection authorities and other competent authorities."
    implementation_note_de: "Der ISMS Owner hält Kontaktwege zu Datenschutzbehörden und anderen zuständigen Behörden aktuell."
    justification_en:
    justification_de:
  - id: A.5.6
    applicable: true
    status: planned
    implementation_note_en: "Relevant security communities, professional bodies and trusted advisory sources will be monitored."
    implementation_note_de: "Relevante Sicherheitsgemeinschaften, Berufsverbände und vertrauenswürdige Beratungsquellen werden beobachtet."
    justification_en:
    justification_de:
  - id: A.5.7
    applicable: true
    status: planned
    implementation_note_en: "Threat information from suppliers, vulnerability feeds and GitHub security notifications will inform risk reviews."
    implementation_note_de: "Bedrohungsinformationen von Lieferanten, Schwachstellen-Feeds und GitHub-Sicherheitsmeldungen fließen in Risikoprüfungen ein."
    justification_en:
    justification_de:
  - id: A.5.8
    applicable: true
    status: planned
    implementation_note_en: "Security requirements and risk decisions will be included in software and service project planning."
    implementation_note_de: "Sicherheitsanforderungen und Risikoentscheidungen werden in die Planung von Software- und Serviceprojekten aufgenommen."
    justification_en:
    justification_de:
  - id: A.5.9
    applicable: true
    status: planned
    implementation_note_en: "The asset-group register will identify information, systems, services and supporting resources in scope."
    implementation_note_de: "Das Assetgruppenregister identifiziert die im Geltungsbereich befindlichen Informationen, Systeme, Dienste und unterstützenden Ressourcen."
    justification_en:
    justification_de:
  - id: A.5.10
    applicable: true
    status: planned
    implementation_note_en: "Acceptable-use rules will cover GitHub, endpoints, cloud services, credentials, customer data and the ISMS repository."
    implementation_note_de: "Regeln zur zulässigen Nutzung umfassen GitHub, Endgeräte, Cloud-Dienste, Zugangsdaten, Kundendaten und das ISMS-Repository."
    justification_en:
    justification_de:
  - id: A.5.11
    applicable: true
    status: planned
    implementation_note_en: "Leavers and role changes will require return, revocation or secure deletion of organizational assets."
    implementation_note_de: "Bei Austritt oder Rollenwechsel werden Organisationswerte zurückgegeben, entzogen oder sicher gelöscht."
    justification_en:
    justification_de:
  - id: A.5.12
    applicable: true
    status: planned
    implementation_note_en: "Information will be classified as public, internal, confidential or restricted according to business impact."
    implementation_note_de: "Informationen werden entsprechend ihrer Geschäftsauswirkung als öffentlich, intern, vertraulich oder beschränkt eingestuft."
    justification_en:
    justification_de:
  - id: A.5.13
    applicable: true
    status: planned
    implementation_note_en: "Classification labels will be applied to controlled documents, repositories and information exports where practical."
    implementation_note_de: "Klassifizierungskennzeichnungen werden, soweit praktikabel, auf gelenkte Dokumente, Repositories und Informationsexporte angewendet."
    justification_en:
    justification_de:
  - id: A.5.14
    applicable: true
    status: planned
    implementation_note_en: "Transfers of source code, customer data and credentials will use approved channels, access controls and encryption."
    implementation_note_de: "Übertragungen von Quellcode, Kundendaten und Zugangsdaten nutzen genehmigte Kanäle, Zugriffskontrollen und Verschlüsselung."
    justification_en:
    justification_de:
  - id: A.5.15
    applicable: true
    status: planned
    implementation_note_en: "Access will be granted on business need, least privilege and approved role assignments."
    implementation_note_de: "Zugriff wird nach Geschäftsbedarf, geringsten Rechten und genehmigten Rollenzuweisungen gewährt."
    justification_en:
    justification_de:
  - id: A.5.16
    applicable: true
    status: planned
    implementation_note_en: "Joiner, mover and leaver workflows will control identities across the identity provider and connected services."
    implementation_note_de: "Joiner-, Mover- und Leaver-Abläufe steuern Identitäten im Identity Provider und in angebundenen Diensten."
    justification_en:
    justification_de:
  - id: A.5.17
    applicable: true
    status: planned
    implementation_note_en: "Authentication information will be issued, stored, reset and revoked through approved secure mechanisms."
    implementation_note_de: "Authentifizierungsinformationen werden über genehmigte sichere Mechanismen ausgegeben, gespeichert, zurückgesetzt und entzogen."
    justification_en:
    justification_de:
  - id: A.5.18
    applicable: true
    status: planned
    implementation_note_en: "Access rights will be approved, reviewed periodically and removed promptly when no longer required."
    implementation_note_de: "Zugriffsrechte werden genehmigt, regelmäßig überprüft und bei Wegfall des Bedarfs unverzüglich entfernt."
    justification_en:
    justification_de:
  - id: A.5.19
    applicable: true
    status: planned
    implementation_note_en: "Security risks will be assessed for cloud, SaaS, hosting, backup and other ICT suppliers."
    implementation_note_de: "Sicherheitsrisiken werden für Cloud-, SaaS-, Hosting-, Backup- und andere ICT-Lieferanten bewertet."
    justification_en:
    justification_de:
  - id: A.5.20
    applicable: true
    status: planned
    implementation_note_en: "Supplier agreements will address confidentiality, access, incident notification, continuity and data protection."
    implementation_note_de: "Lieferantenverträge regeln Vertraulichkeit, Zugriff, Vorfallmeldung, Kontinuität und Datenschutz."
    justification_en:
    justification_de:
  - id: A.5.21
    applicable: true
    status: planned
    implementation_note_en: "Critical ICT dependencies and their inherited security requirements will be recorded and reviewed."
    implementation_note_de: "Kritische ICT-Abhängigkeiten und übernommene Sicherheitsanforderungen werden dokumentiert und überprüft."
    justification_en:
    justification_de:
  - id: A.5.22
    applicable: true
    status: planned
    implementation_note_en: "Supplier performance, security changes and service reviews will be tracked by the responsible service owner."
    implementation_note_de: "Lieferantenleistung, Sicherheitsänderungen und Servicereviews werden durch den zuständigen Service Owner nachverfolgt."
    justification_en:
    justification_de:
  - id: A.5.23
    applicable: true
    status: planned
    implementation_note_en: "Cloud services will be selected, configured, monitored and exited using documented security requirements."
    implementation_note_de: "Cloud-Dienste werden anhand dokumentierter Sicherheitsanforderungen ausgewählt, konfiguriert, überwacht und beendet."
    justification_en:
    justification_de:
  - id: A.5.24
    applicable: true
    status: planned
    implementation_note_en: "Incident roles, reporting channels, triage criteria and response resources will be prepared and exercised."
    implementation_note_de: "Vorfallrollen, Meldewege, Triage-Kriterien und Reaktionsressourcen werden vorbereitet und geübt."
    justification_en:
    justification_de:
  - id: A.5.25
    applicable: true
    status: planned
    implementation_note_en: "Reported events will be assessed for credibility, impact, classification and escalation."
    implementation_note_de: "Gemeldete Ereignisse werden auf Plausibilität, Auswirkungen, Einstufung und Eskalation bewertet."
    justification_en:
    justification_de:
  - id: A.5.26
    applicable: true
    status: planned
    implementation_note_en: "Confirmed incidents will be contained, investigated, communicated and recovered by assigned responders."
    implementation_note_de: "Bestätigte Vorfälle werden durch zugewiesene Einsatzkräfte eingedämmt, untersucht, kommuniziert und behoben."
    justification_en:
    justification_de:
  - id: A.5.27
    applicable: true
    status: planned
    implementation_note_en: "Incident reviews will identify lessons, corrective actions and updates to controls and risk treatment."
    implementation_note_de: "Vorfallauswertungen identifizieren Erkenntnisse, Korrekturmaßnahmen und Aktualisierungen von Kontrollen und Risikobehandlung."
    justification_en:
    justification_de:
  - id: A.5.28
    applicable: true
    status: planned
    implementation_note_en: "Relevant incident and investigation records will be preserved with integrity, access restriction and traceability."
    implementation_note_de: "Relevante Vorfall- und Untersuchungsaufzeichnungen werden integer, zugriffsbeschränkt und nachvollziehbar aufbewahrt."
    justification_en:
    justification_de:
  - id: A.5.29
    applicable: true
    status: planned
    implementation_note_en: "Security responsibilities and minimum controls will remain defined during service or staffing disruption."
    implementation_note_de: "Sicherheitsverantwortlichkeiten und Mindestkontrollen bleiben während Dienst- oder Personalausfällen festgelegt."
    justification_en:
    justification_de:
  - id: A.5.30
    applicable: true
    status: planned
    implementation_note_en: "Critical development, hosting, identity and backup services will have continuity and recovery arrangements."
    implementation_note_de: "Kritische Entwicklungs-, Hosting-, Identitäts- und Backup-Dienste erhalten Kontinuitäts- und Wiederherstellungsregelungen."
    justification_en:
    justification_de:
  - id: A.5.31
    applicable: true
    status: planned
    implementation_note_en: "ISO, GDPR, contractual, supplier and record-retention requirements will be maintained in the compliance process."
    implementation_note_de: "Anforderungen aus ISO, DSGVO, Verträgen, Lieferantenverpflichtungen und Aufbewahrung werden im Compliance-Prozess gepflegt."
    justification_en:
    justification_de:
  - id: A.5.32
    applicable: true
    status: planned
    implementation_note_en: "Software licences, open-source obligations, customer rights and other intellectual-property constraints will be tracked."
    implementation_note_de: "Softwarelizenzen, Open-Source-Pflichten, Kundenrechte und sonstige Rechte des geistigen Eigentums werden nachverfolgt."
    justification_en:
    justification_de:
  - id: A.5.33
    applicable: true
    status: planned
    implementation_note_en: "Business and security records will be protected from loss, alteration and unauthorized disclosure for their retention period."
    implementation_note_de: "Geschäfts- und Sicherheitsaufzeichnungen werden während ihrer Aufbewahrungsfrist vor Verlust, Änderung und unbefugter Offenlegung geschützt."
    justification_en:
    justification_de:
  - id: A.5.34
    applicable: true
    status: planned
    implementation_note_en: "Personal-data processing will follow GDPR principles, data-subject rights, processor controls and breach obligations."
    implementation_note_de: "Die Verarbeitung personenbezogener Daten folgt DSGVO-Grundsätzen, Betroffenenrechten, Auftragsverarbeiterkontrollen und Meldepflichten."
    justification_en:
    justification_de:
  - id: A.5.35
    applicable: true
    status: planned
    implementation_note_en: "Independent internal or external reviews will evaluate ISMS conformity and control design."
    implementation_note_de: "Unabhängige interne oder externe Prüfungen bewerten die Konformität des ISMS und die Ausgestaltung der Kontrollen."
    justification_en:
    justification_de:
  - id: A.5.36
    applicable: true
    status: planned
    implementation_note_en: "Compliance checks will test adherence to policies, procedures, contractual commitments and selected standards."
    implementation_note_de: "Compliance-Prüfungen testen die Einhaltung von Leitlinien, Verfahren, Vertragszusagen und ausgewählten Standards."
    justification_en:
    justification_de:
  - id: A.5.37
    applicable: true
    status: planned
    implementation_note_en: "Documented operating procedures will define repeatable security activities and their required records."
    implementation_note_de: "Dokumentierte Betriebsverfahren definieren wiederholbare Sicherheitsaktivitäten und die erforderlichen Aufzeichnungen."
    justification_en:
    justification_de:
  - id: A.6.1
    applicable: true
    status: planned
    implementation_note_en: "Pre-engagement screening will be proportionate to role, access, employment law and contractor arrangements."
    implementation_note_de: "Vorvertragliche Prüfungen werden verhältnismäßig nach Rolle, Zugriff, Arbeitsrecht und Auftragnehmerverhältnis durchgeführt."
    justification_en:
    justification_de:
  - id: A.6.2
    applicable: true
    status: planned
    implementation_note_en: "Employment and contractor terms will state security, confidentiality, acceptable-use and reporting duties."
    implementation_note_de: "Arbeits- und Auftragnehmerbedingungen enthalten Pflichten zu Sicherheit, Vertraulichkeit, zulässiger Nutzung und Meldungen."
    justification_en:
    justification_de:
  - id: A.6.3
    applicable: true
    status: planned
    implementation_note_en: "Employees and contractors will receive security awareness and role-relevant training at onboarding and periodically."
    implementation_note_de: "Mitarbeitende und Auftragnehmer erhalten bei Beginn und regelmäßig Sicherheitsbewusstsein sowie rollenbezogene Schulungen."
    justification_en:
    justification_de:
  - id: A.6.4
    applicable: true
    status: planned
    implementation_note_en: "Security violations will be handled through a fair, documented and legally appropriate disciplinary process."
    implementation_note_de: "Sicherheitsverstöße werden durch einen fairen, dokumentierten und rechtlich angemessenen Disziplinarprozess behandelt."
    justification_en:
    justification_de:
  - id: A.6.5
    applicable: true
    status: planned
    implementation_note_en: "Confidentiality, access and asset obligations will continue after termination or role change."
    implementation_note_de: "Pflichten zu Vertraulichkeit, Zugriff und Organisationswerten gelten nach Austritt oder Rollenwechsel fort."
    justification_en:
    justification_de:
  - id: A.6.6
    applicable: true
    status: planned
    implementation_note_en: "Confidentiality commitments will be obtained from staff, contractors and relevant third parties before access."
    implementation_note_de: "Vor Zugriff werden von Mitarbeitenden, Auftragnehmern und relevanten Dritten Vertraulichkeitszusagen eingeholt."
    justification_en:
    justification_de:
  - id: A.6.7
    applicable: true
    status: planned
    implementation_note_en: "Remote work will require secure connectivity, protected endpoints, private working conditions and incident reporting."
    implementation_note_de: "Remote-Arbeit erfordert sichere Verbindungen, geschützte Endgeräte, geeignete Arbeitsbedingungen und Vorfallmeldungen."
    justification_en:
    justification_de:
  - id: A.6.8
    applicable: true
    status: planned
    implementation_note_en: "Personnel will have clear channels and expectations for promptly reporting suspected security events."
    implementation_note_de: "Personal erhält klare Meldewege und Erwartungen zur unverzüglichen Meldung vermuteter Sicherheitsereignisse."
    justification_en:
    justification_de:
  - id: A.7.1
    applicable: true
    status: planned
    implementation_note_en: "Physical boundaries for offices and home-working areas will be defined according to the assets and information handled."
    implementation_note_de: "Physische Grenzen für Büros und Homeoffice-Bereiche werden entsprechend der dort verarbeiteten Werte und Informationen festgelegt."
    justification_en:
    justification_de:
  - id: A.7.2
    applicable: true
    status: planned
    implementation_note_en: "Office access and visitor handling will protect equipment, records and restricted working areas."
    implementation_note_de: "Bürozutritt und Besucherbehandlung schützen Geräte, Aufzeichnungen und beschränkte Arbeitsbereiche."
    justification_en:
    justification_de:
  - id: A.7.3
    applicable: true
    status: planned
    implementation_note_en: "Offices, rooms and home-working locations will be arranged to reduce unauthorized observation or access."
    implementation_note_de: "Büros, Räume und Homeoffice-Arbeitsplätze werden so gestaltet, dass Beobachtung und Zugriff durch Unbefugte reduziert werden."
    justification_en:
    justification_de:
  - id: A.7.4
    applicable: true
    status: planned
    implementation_note_en: "Available building or landlord security monitoring will be considered for locations holding organizational assets."
    implementation_note_de: "Verfügbare Gebäude- oder Vermietersicherheitsüberwachung wird für Standorte mit Organisationswerten berücksichtigt."
    justification_en:
    justification_de:
  - id: A.7.5
    applicable: true
    status: planned
    implementation_note_en: "Fire, water, power, temperature and other physical threats will be addressed through location and continuity measures."
    implementation_note_de: "Brand, Wasser, Strom, Temperatur und andere physische Bedrohungen werden durch Standort- und Kontinuitätsmaßnahmen berücksichtigt."
    justification_en:
    justification_de:
  - id: A.7.6
    applicable: true
    status: planned
    implementation_note_en: "Secure-area working rules will restrict exposure of confidential information and administrative equipment."
    implementation_note_de: "Regeln für Arbeiten in geschützten Bereichen begrenzen die Offenlegung vertraulicher Informationen und administrativer Geräte."
    justification_en:
    justification_de:
  - id: A.7.7
    applicable: true
    status: planned
    implementation_note_en: "Clear-desk and clear-screen practices will apply to distributed work and meetings involving confidential information."
    implementation_note_de: "Clean-Desk- und Clean-Screen-Praktiken gelten für verteiltes Arbeiten und Besprechungen mit vertraulichen Informationen."
    justification_en:
    justification_de:
  - id: A.7.8
    applicable: true
    status: planned
    implementation_note_en: "Equipment will be positioned and protected against unauthorized access, damage and environmental exposure."
    implementation_note_de: "Geräte werden gegen unbefugten Zugriff, Beschädigung und Umwelteinflüsse aufgestellt und geschützt."
    justification_en:
    justification_de:
  - id: A.7.9
    applicable: true
    status: planned
    implementation_note_en: "Off-premises endpoints and removable equipment will be protected during transport, storage and remote use."
    implementation_note_de: "Ausgelagerte Endgeräte und mobile Geräte werden bei Transport, Lagerung und Remote-Nutzung geschützt."
    justification_en:
    justification_de:
  - id: A.7.10
    applicable: true
    status: planned
    implementation_note_en: "Storage media will be controlled, encrypted where appropriate and securely disposed of when no longer needed."
    implementation_note_de: "Speichermedien werden kontrolliert, bei Bedarf verschlüsselt und bei Nichtgebrauch sicher entsorgt."
    justification_en:
    justification_de:
  - id: A.7.11
    applicable: true
    status: planned
    implementation_note_en: "Dependence on office utilities and hosted facilities will be considered in continuity and recovery planning."
    implementation_note_de: "Abhängigkeiten von Büroversorgungen und gehosteten Einrichtungen werden in der Kontinuitäts- und Wiederherstellungsplanung berücksichtigt."
    justification_en:
    justification_de:
  - id: A.7.12
    applicable: true
    status: planned
    implementation_note_en: "Network and power cabling within managed locations will be protected against interception, damage and disruption."
    implementation_note_de: "Netzwerk- und Stromverkabelung in verwalteten Standorten wird gegen Abhören, Beschädigung und Unterbrechung geschützt."
    justification_en:
    justification_de:
  - id: A.7.13
    applicable: true
    status: planned
    implementation_note_en: "Equipment maintenance will be authorized, recorded and performed to preserve security and availability."
    implementation_note_de: "Wartung von Geräten wird genehmigt, aufgezeichnet und zur Wahrung von Sicherheit und Verfügbarkeit durchgeführt."
    justification_en:
    justification_de:
  - id: A.7.14
    applicable: true
    status: planned
    implementation_note_en: "Equipment reuse and disposal will remove organizational data and verify secure sanitization."
    implementation_note_de: "Bei Wiederverwendung und Entsorgung werden Organisationsdaten entfernt und sichere Löschung überprüft."
    justification_en:
    justification_de:
  - id: A.8.1
    applicable: true
    status: planned
    implementation_note_en: "Endpoint devices will be inventoried, securely configured, encrypted, updated and managed for remote work."
    implementation_note_de: "Endgeräte werden inventarisiert, sicher konfiguriert, verschlüsselt, aktualisiert und für Remote-Arbeit verwaltet."
    justification_en:
    justification_de:
  - id: A.8.2
    applicable: true
    status: planned
    implementation_note_en: "Privileged access will be limited, separately authenticated, monitored and reviewed."
    implementation_note_de: "Privilegierter Zugriff wird begrenzt, separat authentifiziert, überwacht und überprüft."
    justification_en:
    justification_de:
  - id: A.8.3
    applicable: true
    status: planned
    implementation_note_en: "Access restrictions will separate source code, customer data, secrets, production services and ISMS records by need."
    implementation_note_de: "Zugriffsbeschränkungen trennen Quellcode, Kundendaten, Geheimnisse, Produktivdienste und ISMS-Aufzeichnungen nach Bedarf."
    justification_en:
    justification_de:
  - id: A.8.4
    applicable: true
    status: planned
    implementation_note_en: "Source-code access will be restricted through repository permissions, protected branches and approved reviews."
    implementation_note_de: "Der Zugriff auf Quellcode wird durch Repository-Berechtigungen, geschützte Branches und genehmigte Reviews begrenzt."
    justification_en:
    justification_de:
  - id: A.8.5
    applicable: true
    status: planned
    implementation_note_en: "Secure authentication will use MFA, strong credentials, phishing-resistant options where available and session controls."
    implementation_note_de: "Sichere Authentifizierung nutzt MFA, starke Zugangsdaten, verfügbare phishing-resistente Optionen und Sitzungssteuerung."
    justification_en:
    justification_de:
  - id: A.8.6
    applicable: true
    status: planned
    implementation_note_en: "Capacity of repositories, CI/CD, hosting, storage and backup services will be monitored and planned."
    implementation_note_de: "Die Kapazität von Repositories, CI/CD-, Hosting-, Speicher- und Backup-Diensten wird überwacht und geplant."
    justification_en:
    justification_de:
  - id: A.8.7
    applicable: true
    status: planned
    implementation_note_en: "Managed endpoints, build systems and hosted workloads will use malware prevention and response capabilities."
    implementation_note_de: "Verwaltete Endgeräte, Build-Systeme und gehostete Workloads nutzen Malware-Prävention und Reaktionsmöglichkeiten."
    justification_en:
    justification_de:
  - id: A.8.8
    applicable: true
    status: planned
    implementation_note_en: "Vulnerabilities will be identified, risk-ranked, remediated within target times and verified."
    implementation_note_de: "Schwachstellen werden identifiziert, risikobasiert priorisiert, innerhalb von Zielzeiten behoben und verifiziert."
    justification_en:
    justification_de:
  - id: A.8.9
    applicable: true
    status: planned
    implementation_note_en: "Secure baselines and configuration changes for repositories, pipelines, endpoints and cloud services will be controlled."
    implementation_note_de: "Sichere Baselines und Konfigurationsänderungen für Repositories, Pipelines, Endgeräte und Cloud-Dienste werden gesteuert."
    justification_en:
    justification_de:
  - id: A.8.10
    applicable: true
    status: planned
    implementation_note_en: "Information deletion will follow retention, contractual and GDPR requirements and be evidenced where material."
    implementation_note_de: "Informationslöschung folgt Aufbewahrungs-, Vertrags- und DSGVO-Anforderungen und wird bei wesentlichen Fällen nachgewiesen."
    justification_en:
    justification_de:
  - id: A.8.11
    applicable: true
    status: planned
    implementation_note_en: "Sensitive test and operational data will be masked or minimized before use outside its original purpose."
    implementation_note_de: "Sensible Test- und Betriebsdaten werden vor zweckfremder Nutzung maskiert oder minimiert."
    justification_en:
    justification_de:
  - id: A.8.12
    applicable: true
    status: planned
