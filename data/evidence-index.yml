  - id: EV-INCIDENT-EXERCISE
    title_en: Fictional incident response tabletop exercise
    title_de: Fiktive Planspielübung zur Reaktion auf Informationssicherheitsvorfälle
    path: "evidence/manual/2026-08-incident-exercise.md"
